name: Test & Minify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: minify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 압축 전 소스 기준으로 회귀 테스트 실행 (MD5/CSV/i18n/슬러그/마크다운/컬러)
      - name: Run tests
        run: npm test

      # 압축. scripts/minify.js는 테스트가 추출하는 함수명(md5, toSlug 등)을
      # 맹글링에서 보존(reserved)하므로, 압축 후에도 npm test 가 동작한다.
      - name: Minify CSS & JS
        run: npm run minify

      - name: Commit minified files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify CSS & JS [skip ci]"
          commit_author: GitHub Actions <github-actions@github.com>
