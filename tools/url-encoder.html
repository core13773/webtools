<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-4794002106764884">
  <title>URL 인코더/디코더 - 온라인 퍼센트 인코딩 | DevUtils</title>
  <meta name="description" content="URL에 사용할 수 없는 문자를 퍼센트 인코딩으로 변환하거나 원래 문자로 되돌리는 묣은 온라인 도구입니다.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Dev<span>Utils</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">홈</a></li>
        <li><a href="json-formatter.html">JSON</a></li>
        <li><a href="base64.html">Base64</a></li>
        <li><a href="url-encoder.html">URL</a></li>
        <li><a href="password-generator.html">비밀번호</a></li>
        <li><button id="theme-toggle" title="다크모드 전환">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="ad-slot">📢 상단 배너 광고 영역</div>

    <div class="tool-header">
      <h1>URL 인코더 / 디코더</h1>
      <p>한글이나 특수문자가 포함된 URL을 안전하게 인코딩하세요.</p>
    </div>

    <div class="tool-box">
      <div class="form-group">
        <label for="url-input">입력 텍스트 / URL</label>
        <textarea id="url-input" rows="6" placeholder="예: https://example.com/검색?q=안녕"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn" onclick="encodeURL()">🔼 인코딩</button>
        <button class="btn" onclick="decodeURL()">🔽 디코딩</button>
        <button class="btn btn-outline" onclick="copyResult()">📋 결과 복사</button>
        <button class="btn btn-outline" onclick="clearAll()">🗑️ 초기화</button>
      </div>

      <div class="form-group" style="margin-top:1.2rem;">
        <label for="url-output">결과</label>
        <div id="url-output" class="result-box">결과가 여기에 표시됩니다.</div>
      </div>
    </div>

    <div class="ad-slot">📢 컨텐츠 내 광고 영역</div>
  </main>

  <footer><p>© 2026 DevUtils. 묣은 온라인 도구 모음.</p></footer>

  <script src="../js/app.js"></script>
  <script>
    const input = document.getElementById('url-input');
    const output = document.getElementById('url-output');

    function encodeURL(){
      try {
        const text = input.value;
        if(!text) return output.textContent = '텍스트를 입력해주세요.';
        output.textContent = encodeURIComponent(text);
        output.style.color = 'var(--text)';
      } catch(e) {
        output.textContent = '❌ 오류: ' + e.message;
        output.style.color = '#ef4444';
      }
    }

    function decodeURL(){
      try {
        const text = input.value.trim();
        if(!text) return output.textContent = '인코딩된 문자열을 입력해주세요.';
        output.textContent = decodeURIComponent(text);
        output.style.color = 'var(--text)';
      } catch(e) {
        output.textContent = '❌ 디코딩 오류: 올바른 인코딩 문자열인지 확인하세요.';
        output.style.color = '#ef4444';
      }
    }

    function copyResult(){
      copyToClipboard(output.textContent).then(()=>showToast('복사 완료!'));
    }

    function clearAll(){
      input.value = '';
      output.textContent = '결과가 여기에 표시됩니다.';
      output.style.color = 'var(--text-muted)';
    }
  </script>
</body>
</html>
