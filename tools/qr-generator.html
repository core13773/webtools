<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-4794002106764884">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4794002106764884" crossorigin="anonymous"></script>
  <title>QR 코드 생성기 - 텍스트/URL을 QR 코드로 변환 | WebTools</title>
  <meta name="description" content="URL이나 텍스트를 스캔할 수 있는 QR 코드 이미지로 즉시 변환하는 무료 온라인 도구입니다.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Web<span>Tools</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">홈</a></li>
        <li><button id="theme-toggle" title="다크모드 전환">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="ad-slot">📢 상단 배너 광고 영역</div>

    <div class="tool-header">
      <h1>QR 코드 생성기</h1>
      <p>URL이나 텍스트를 QR 코드 이미지로 변환합니다.</p>
    </div>

    <div class="tool-box">
      <div class="form-group">
        <label for="qr-input">텍스트 또는 URL 입력</label>
        <textarea id="qr-input" rows="4" placeholder="예: https://core13773.github.io/webtools/"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn" onclick="generateQR()">📱 QR 코드 생성</button>
        <button class="btn btn-outline" onclick="clearAll()">🗑️ 초기화</button>
      </div>

      <div class="form-group" style="margin-top:1.2rem; text-align:center;">
        <label>생성된 QR 코드</label>
        <div id="qr-result" style="padding:1rem;">
          <p style="color:var(--text-muted);">텍스트를 입력하고 생성 버튼을 누르세요.</p>
        </div>
      </div>
    </div>

    <div class="ad-slot">📢 컨텐츠 내 광고 영역</div>
  </main>

  <footer><p>© 2026 WebTools. 무료 온라인 도구 모음.</p></footer>

  <script src="../js/app.js"></script>
  <script>
    function generateQR(){
      const text = document.getElementById('qr-input').value.trim();
      const result = document.getElementById('qr-result');
      if(!text){
        result.innerHTML = '<p style="color:var(--text-muted);">텍스트를 입력해주세요.</p>';
        return;
      }
      const encoded = encodeURIComponent(text);
      const url = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encoded}`;
      result.innerHTML = `<img src="${url}" alt="QR Code" style="max-width:200px; border:1px solid var(--border); border-radius:var(--radius-sm);"><br><a href="${url}" download="qrcode.png" target="_blank" style="display:inline-block; margin-top:.8rem; color:var(--primary); font-weight:600;">이미지 다운로드</a>`;
    }

    function clearAll(){
      document.getElementById('qr-input').value = '';
      document.getElementById('qr-result').innerHTML = '<p style="color:var(--text-muted);">텍스트를 입력하고 생성 버튼을 누르세요.</p>';
    }
  </script>
</body>
</html>
