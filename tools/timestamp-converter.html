<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="google-adsense-account" content="ca-pub-4794002106764884">
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4794002106764884" crossorigin="anonymous"></script>
 <title>타임스탬프 변환기 - Unix Timestamp 날짜 변환 | WebTools</title>
 <meta name="description" content="Unix 타임스탬프를 사람이 읽을 수 있는 날짜/시간으로 변환하고, 현재 시간의 타임스탬프를 확인하는 온라인 도구입니다.">
 <link rel="stylesheet" href="../css/style.css">
</head>
<body>
 <header>
 <nav>
 <a href="../index.html" class="logo">Web<span>Tools</span></a>
 <ul class="nav-links">
 <li><a href="../index.html">홈</a></li>
 <li><button id="theme-toggle" title="다크모드 전환">🌙</button></li>
 </ul>
 </nav>
 </header>

 <main class="container">
 <div class="ad-slot">📢 상단 배너 광고 영역</div>

 <div class="tool-header">
 <h1>타임스탬프 변환기</h1>
 <p>Unix 타임스탬프(초/밀리초)를 날짜/시간으로 변환합니다.</p>
 </div>

 <div class="tool-box">
 <div class="form-group">
 <label>현재 시간</label>
 <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem;">
 <div style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem;">
 <div style="color:var(--text-muted); font-size:.85rem;">Unix Timestamp (초)</div>
 <div style="font-size:1.3rem; font-weight:700; font-family:monospace;" id="current-ts">-</div>
 </div>
 <div style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem;">
 <div style="color:var(--text-muted); font-size:.85rem;">현재 날짜/시간</div>
 <div style="font-size:1.1rem; font-weight:700;" id="current-date">-</div>
 </div>
 </div>
 </div>

 <div class="form-group">
 <label for="ts-input">타임스탬프 입력</label>
 <input type="text" id="ts-input" placeholder="예: 1717200000 또는 1717200000000">
 </div>

 <div class="btn-row">
 <button class="btn" onclick="convertTs()">🔄 변환</button>
 <button class="btn btn-outline" onclick="useNow()">⏰ 현재 시간 사용</button>
 <button class="btn btn-outline" onclick="copyResult()">📋 복사</button>
 </div>

 <div class="form-group" style="margin-top:1.2rem;">
 <label>변환 결과</label>
 <div id="ts-output" class="result-box">결과가 여기에 표시됩니다.</div>
 </div>
 </div>

 <div class="ad-slot">📢 컨텐츠 내 광고 영역</div>
 </main>

 <footer><p>© 2026 WebTools. 온라인 도구 모음.</p></footer>

 <script src="../js/app.js"></script>
 <script>
 const tsInput = document.getElementById('ts-input');
 const tsOutput = document.getElementById('ts-output');

 function updateCurrent(){
 const now = Date.now();
 document.getElementById('current-ts').textContent = Math.floor(now/1000);
 document.getElementById('current-date').textContent = new Date().toLocaleString('ko-KR');
 }

 setInterval(updateCurrent, 1000);
 updateCurrent();

 function convertTs(){
 const v = tsInput.value.trim();
 if(!v) return tsOutput.textContent = '타임스탬프를 입력해주세요.';
 let ms = parseInt(v);
 if(isNaN(ms)) return tsOutput.textContent = '❌ 숫자를 입력해주세요.';
 if(v.length <= 10) ms *= 1000; // 초 단위

 const d = new Date(ms);
 if(isNaN(d.getTime())) return tsOutput.textContent = '❌ 유효하지 않은 타임스탬프입니다.';

 const lines = [
 `📅 로컬 시간: ${d.toLocaleString('ko-KR')}`,
 `🌍 UTC 시간: ${d.toUTCString()}`,
 `📊 ISO 8601: ${d.toISOString()}`,
 ``,
 `초 단위: ${Math.floor(ms/1000)}`,
 `밀리초: ${ms}`,
 ];
 tsOutput.textContent = lines.join('\n');
 tsOutput.style.color = 'var(--text)';
 }

 function useNow(){
 tsInput.value = Math.floor(Date.now()/1000);
 convertTs();
 }

 function copyResult(){
 copyToClipboard(tsOutput.textContent).then(()=>showToast('복사 완료!'));
 }
 </script>
</body>
</html>
