<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-4794002106764884">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4794002106764884" crossorigin="anonymous"></script>
  <title>UUID 생성기 - 무료  GUID/랜덤 아이디 생성 | WebTools</title>
  <meta name="description" content="범용 고유 식별자(UUID v4)를 한 번에 여러 개 생성하는 무료  온라인 도구입니다.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Web<span>Tools</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">홈</a></li>
        <li><button id="theme-toggle" title="다크모드 전환">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="ad-slot">📢 상단 배너 광고 영역</div>

    <div class="tool-header">
      <h1>UUID 생성기</h1>
      <p>범용 고유 식별자(UUID v4)를 즉시 생성합니다.</p>
    </div>

    <div class="tool-box">
      <div class="form-group">
        <label for="count">생성 개수</label>
        <input type="number" id="count" value="5" min="1" max="100" style="max-width:150px;">
      </div>

      <div class="btn-row">
        <button class="btn" onclick="generate()">🎲 UUID 생성</button>
        <button class="btn btn-outline" onclick="copyResult()">📋 복사</button>
      </div>

      <div class="form-group" style="margin-top:1.2rem;">
        <label>생성 결과</label>
        <div id="uuid-output" class="result-box">결과가 여기에 표시됩니다.</div>
      </div>
    </div>

    <div class="ad-slot">📢 컨텐츠 내 광고 영역</div>
  </main>

  <footer><p>© 2026 WebTools. 무료  온라인 도구 모음.</p></footer>

  <script src="../js/app.js"></script>
  <script>
    const output = document.getElementById('uuid-output');

    function uuidv4(){
      return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      );
    }

    function generate(){
      const n = Math.min(100, Math.max(1, parseInt(document.getElementById('count').value) || 5));
      const arr = [];
      for(let i=0;i<n;i++) arr.push(uuidv4());
      output.textContent = arr.join('\n');
      output.style.color = 'var(--text)';
    }

    function copyResult(){
      copyToClipboard(output.textContent).then(()=>showToast('복사 완료!'));
    }

    generate();
  </script>
</body>
</html>
