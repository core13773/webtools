<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-4794002106764884">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4794002106764884" crossorigin="anonymous"></script>
  <title>색상 변환기 - HEX, RGB, HSL 변환 및 컬러피커 | WebTools</title>
  <meta name="description" content="HEX, RGB, HSL 색상 코드를 서로 변환하고 실시간 미리보기로 확인하는 무료 온라인 컬러 도구입니다.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Web<span>Tools</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">홈</a></li>
        <li><button id="theme-toggle" title="다크모드 전환">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="ad-slot">📢 상단 배너 광고 영역</div>

    <div class="tool-header">
      <h1>색상 변환기</h1>
      <p>HEX, RGB, HSL 색상 코드를 자유롭게 변환하고 색상을 미리보세요.</p>
    </div>

    <div class="tool-box">
      <div class="form-group" style="display:flex; gap:1rem; flex-wrap:wrap; align-items:center;">
        <label>컬러 선택</label>
        <input type="color" id="color-picker" value="#4f46e5" style="width:60px; height:40px; padding:0; border:none; cursor:pointer;">
        <input type="text" id="hex-input" value="#4f46e5" style="flex:1; min-width:120px;">
      </div>

      <div class="form-group">
        <label>RGB</label>
        <input type="text" id="rgb-output" readonly onclick="copySingle(this)">
      </div>

      <div class="form-group">
        <label>HSL</label>
        <input type="text" id="hsl-output" readonly onclick="copySingle(this)">
      </div>

      <div class="form-group">
        <label>미리보기</label>
        <div id="color-preview" style="height:80px; border-radius:var(--radius-sm); border:1px solid var(--border); transition:background .2s;"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-outline" onclick="copyAll()">📋 모두 복사</button>
        <button class="btn btn-outline" onclick="randomColor()">🎲 랜덤 색상</button>
      </div>
    </div>

    <div class="ad-slot">📢 컨텐츠 내 광고 영역</div>
  </main>

  <footer><p>© 2026 WebTools. 무료 온라인 도구 모음.</p></footer>

  <script src="../js/app.js"></script>
  <script>
    const picker = document.getElementById('color-picker');
    const hexInput = document.getElementById('hex-input');
    const rgbOut = document.getElementById('rgb-output');
    const hslOut = document.getElementById('hsl-output');
    const preview = document.getElementById('color-preview');

    function hexToRgb(hex){
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function hexToHsl(hex){
      let r = parseInt(hex.slice(1,3),16)/255;
      let g = parseInt(hex.slice(3,5),16)/255;
      let b = parseInt(hex.slice(5,7),16)/255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h=0,s=0,l=(max+min)/2;
      if(max!==min){
        const d = max-min;
        s = l>0.5?d/(2-max-min):d/(max+min);
        switch(max){
          case r: h=(g-b)/d+(g<b?6:0); break;
          case g: h=(b-r)/d+2; break;
          case b: h=(r-g)/d+4; break;
        }
        h/=6;
      }
      return `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
    }

    function update(hex){
      if(!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
      rgbOut.value = hexToRgb(hex);
      hslOut.value = hexToHsl(hex);
      preview.style.background = hex;
    }

    picker.addEventListener('input', (e)=>{
      hexInput.value = e.target.value;
      update(e.target.value);
    });

    hexInput.addEventListener('input', (e)=>{
      let v = e.target.value;
      if(v.length===7){
        picker.value = v;
        update(v);
      }
    });

    function randomColor(){
      const hex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
      picker.value = hex;
      hexInput.value = hex;
      update(hex);
    }

    function copyAll(){
      const text = `HEX: ${hexInput.value}\nRGB: ${rgbOut.value}\nHSL: ${hslOut.value}`;
      copyToClipboard(text).then(()=>showToast('복사 완료!'));
    }

    function copySingle(el){
      copyToClipboard(el.value).then(()=>showToast('복사 완료!'));
    }

    update('#4f46e5');
  </script>
</body>
</html>
