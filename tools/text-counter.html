<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-4794002106764884">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4794002106764884" crossorigin="anonymous"></script>
  <title>글자수 세기 - 온라인 문자수, 단어수, 바이트 계산 | WebTools</title>
  <meta name="description" content="텍스트의 글자수(공백 포함/제외), 단어수, 문장수, 바이트 수를 실시간으로 계산하는 무료 온라인 도구입니다.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Web<span>Tools</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">홈</a></li>
        <li><button id="theme-toggle" title="다크모드 전환">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="ad-slot">📢 상단 배너 광고 영역</div>

    <div class="tool-header">
      <h1>글자수 세기</h1>
      <p>텍스트를 입력하면 글자수, 단어수, 바이트 수를 실시간으로 계산합니다.</p>
    </div>

    <div class="tool-box">
      <div class="form-group">
        <label for="text-input">텍스트 입력</label>
        <textarea id="text-input" rows="10" placeholder="여기에 텍스트를 입력하세요..."></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-outline" onclick="copyText()">📋 텍스트 복사</button>
        <button class="btn btn-outline" onclick="clearText()">🗑️ 초기화</button>
      </div>

      <div class="stats-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:1rem; margin-top:1.5rem;">
        <div class="stat-card" style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; text-align:center;">
          <div style="font-size:1.5rem; font-weight:800; color:var(--primary);" id="stat-chars">0</div>
          <div style="color:var(--text-muted); font-size:.85rem;">전체 글자수</div>
        </div>
        <div class="stat-card" style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; text-align:center;">
          <div style="font-size:1.5rem; font-weight:800; color:var(--primary);" id="stat-chars-no-space">0</div>
          <div style="color:var(--text-muted); font-size:.85rem;">공백 제외 글자수</div>
        </div>
        <div class="stat-card" style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; text-align:center;">
          <div style="font-size:1.5rem; font-weight:800; color:var(--primary);" id="stat-words">0</div>
          <div style="color:var(--text-muted); font-size:.85rem;">단어수</div>
        </div>
        <div class="stat-card" style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; text-align:center;">
          <div style="font-size:1.5rem; font-weight:800; color:var(--primary);" id="stat-lines">0</div>
          <div style="color:var(--text-muted); font-size:.85rem;">줄 수</div>
        </div>
        <div class="stat-card" style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; text-align:center;">
          <div style="font-size:1.5rem; font-weight:800; color:var(--primary);" id="stat-bytes">0</div>
          <div style="color:var(--text-muted); font-size:.85rem;">바이트</div>
        </div>
        <div class="stat-card" style="background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; text-align:center;">
          <div style="font-size:1.5rem; font-weight:800; color:var(--primary);" id="stat-sentences">0</div>
          <div style="color:var(--text-muted); font-size:.85rem;">문장 수</div>
        </div>
      </div>
    </div>

    <div class="ad-slot">📢 컨텐츠 내 광고 영역</div>
  </main>

  <footer><p>© 2026 WebTools. 무료 온라인 도구 모음.</p></footer>

  <script src="../js/app.js"></script>
  <script>
    const input = document.getElementById('text-input');

    function updateStats(){
      const text = input.value;
      const noSpace = text.replace(/\s/g, '');
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const lines = text ? text.split('\n').length : 0;
      const bytes = new Blob([text]).size;
      const sentences = text.trim() ? text.split(/[.!?。！？]+/).filter(s => s.trim()).length : 0;

      document.getElementById('stat-chars').textContent = text.length.toLocaleString();
      document.getElementById('stat-chars-no-space').textContent = noSpace.length.toLocaleString();
      document.getElementById('stat-words').textContent = words.toLocaleString();
      document.getElementById('stat-lines').textContent = lines.toLocaleString();
      document.getElementById('stat-bytes').textContent = bytes.toLocaleString();
      document.getElementById('stat-sentences').textContent = sentences.toLocaleString();
    }

    input.addEventListener('input', updateStats);

    function copyText(){
      copyToClipboard(input.value).then(()=>showToast('복사 완료!'));
    }

    function clearText(){
      input.value = '';
      updateStats();
    }
  </script>
</body>
</html>
