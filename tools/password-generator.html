<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="google-adsense-account" content="ca-pub-4794002106764884">
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4794002106764884" crossorigin="anonymous"></script>
 <title>강력한 비밀번호 생성기 - 온라인 랜덤 비밀번호 | WebTools</title>
 <meta name="description" content="안전하고 강력한 랜덤 비밀번호를 원하는 길이와 조합으로 생성하는 온라인 도구입니다.">
 <link rel="stylesheet" href="../css/style.css">
</head>
<body>
 <header>
 <nav>
 <a href="../index.html" class="logo">Web<span>Tools</span></a>
 <ul class="nav-links">
 <li><a href="../index.html">홈</a></li>
 <li><a href="json-formatter.html">JSON</a></li>
 <li><a href="base64.html">Base64</a></li>
 <li><a href="url-encoder.html">URL</a></li>
 <li><a href="password-generator.html">비밀번호</a></li>
 <li><button id="theme-toggle" title="다크모드 전환">🌙</button></li>
 </ul>
 </nav>
 </header>

 <main class="container">
 <div class="ad-slot">📢 상단 배너 광고 영역</div>

 <div class="tool-header">
 <h1>강력한 비밀번호 생성기</h1>
 <p>해킹에 강한 랜덤 비밀번호를 즉시 생성하세요. 브라우저에서 처리되며 서버로 전송되지 않습니다.</p>
 </div>

 <div class="tool-box">
 <div class="form-group">
 <label for="length">비밀번호 길이: <strong id="len-val">16</strong>자</label>
 <input type="range" id="length" min="4" max="64" value="16" oninput="document.getElementById('len-val').textContent=this.value" style="width:100%;">
 </div>

 <div class="options">
 <label><input type="checkbox" id="use-upper" checked> 대문자 (A-Z)</label>
 <label><input type="checkbox" id="use-lower" checked> 소문자 (a-z)</label>
 <label><input type="checkbox" id="use-number" checked> 숫자 (0-9)</label>
 <label><input type="checkbox" id="use-symbol" checked> 특수문자 (!@#$...)</label>
 </div>

 <div class="btn-row">
 <button class="btn" onclick="generate()">🎲 생성하기</button>
 <button class="btn btn-outline" onclick="copyResult()">📋 복사</button>
 </div>

 <div class="form-group" style="margin-top:1.2rem;">
 <label>생성된 비밀번호</label>
 <div id="pwd-output" class="result-box" style="font-size:1.3rem; letter-spacing:1px; text-align:center; padding:1.5rem;">비밀번호를 생성하세요</div>
 </div>

 <div id="strength" style="margin-top:.8rem; font-weight:700; text-align:center;"></div>
 </div>

 <div class="ad-slot">📢 컨텐츠 내 광고 영역</div>
 </main>

 <footer><p>© 2026 WebTools. 온라인 도구 모음.</p></footer>

 <script src="../js/app.js"></script>
 <script>
 const output = document.getElementById('pwd-output');
 const strength = document.getElementById('strength');

 const CHARS = {
 upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
 lower: 'abcdefghijklmnopqrstuvwxyz',
 number: '0123456789',
 symbol: '!@#$%^&*()_+-=[]{}|;:,.<>?'
 };

 function generate(){
 const len = parseInt(document.getElementById('length').value);
 const pools = [];
 if(document.getElementById('use-upper').checked) pools.push(CHARS.upper);
 if(document.getElementById('use-lower').checked) pools.push(CHARS.lower);
 if(document.getElementById('use-number').checked) pools.push(CHARS.number);
 if(document.getElementById('use-symbol').checked) pools.push(CHARS.symbol);

 if(pools.length === 0){
 output.textContent = '최소 하나의 문자 종류를 선택하세요.';
 output.style.color = '#ef4444';
 strength.textContent = '';
 return;
 }

 const all = pools.join('');
 let pwd = '';
 const cryptoObj = window.crypto || window.msCrypto;
 const arr = new Uint32Array(len);
 cryptoObj.getRandomValues(arr);

 for(let i=0;i<len;i++){
 pwd += all[arr[i] % all.length];
 }

 output.textContent = pwd;
 output.style.color = 'var(--text)';
 evaluateStrength(pwd);
 }

 function evaluateStrength(pwd){
 let score = 0;
 if(pwd.length >= 12) score++;
 if(pwd.length >= 20) score++;
 if(/[A-Z]/.test(pwd)) score++;
 if(/[a-z]/.test(pwd)) score++;
 if(/[0-9]/.test(pwd)) score++;
 if(/[^A-Za-z0-9]/.test(pwd)) score++;

 const labels = ['매우 약함', '약함', '보통', '강함', '매우 강함'];
 const colors = ['#ef4444','#f97316','#eab308','#22c55e','#10b981'];
 const idx = Math.min(4, Math.floor(score/1.2));
 strength.textContent = '보안 강도: ' + labels[idx];
 strength.style.color = colors[idx];
 }

 function copyResult(){
 copyToClipboard(output.textContent).then(()=>showToast('복사 완료!'));
 }

 // 페이지 로드 시 자동 생성
 generate();
 </script>
</body>
</html>
